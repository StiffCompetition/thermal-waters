<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thermal Waters of the World: natural hot and cold springs map, ratings and photos</title>
<meta name="description" content="A free world map of natural thermal springs, hot or cold. Rate them, add photos and keep your been-to and want-to-go lists.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='56' fill='%230e7c86'/%3E%3Cpath d='M60 26C60 26 40 52 40 68a20 20 0 0 0 40 0C80 52 60 26 60 26Z' fill='%23fbf6ee'/%3E%3Cpath d='M44 90q8-8 16 0t16 0' stroke='%23e8683a' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css?v=20261122a">
</head>
<body>
<header class="top">
  <a class="brand" href="#map" data-nav="map">
    <svg viewBox="0 0 120 120" width="34" height="34" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#0e7c86"/><path d="M60 26C60 26 40 52 40 68a20 20 0 0 0 40 0C80 52 60 26 60 26Z" fill="#fbf6ee"/><path d="M44 90q8-8 16 0t16 0" stroke="#e8683a" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
    <span class="name">Thermal Waters of the World<small class="slogan">Hot springs, scored by people who got in.</small></span>
  </a>
  <div class="searchbox">
    <input id="q" type="search" placeholder="Search springs, countries, regions" autocomplete="off" aria-label="Search springs">
    <div id="suggest" class="suggest" hidden></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-nav="map" class="on">Map</button>
    <button data-nav="directory">Directory</button>
    <button data-nav="me">My springs</button>
    <button data-nav="about">About</button>
  </nav>
</header>

<main>
  <section id="view-map" class="view on">
    <div class="maprow">
      <div class="mapwrap">
        <div id="map"></div>
        <div class="maptools">
          <button id="btnFilters" class="pill">Filters <span id="fcount" class="badge" hidden>0</span></button>
          <button id="btnNear" class="pill">Near me</button>
          <button id="btnLayer" class="pill">Satellite</button>
          <button id="btnAdd" class="pill pri">+ Add a spring</button>
        </div>
        <div class="statline" id="statline"></div>
      </div>
      <aside class="listcol">
        <div class="listhead"><b id="listTitle">Springs in view</b><select id="sortSel" aria-label="Sort">
          <option value="rating">Best rated</option><option value="name">Name A to Z</option><option value="near">Nearest</option><option value="temp">Hottest</option></select></div>
        <div id="list" class="list"></div>
      </aside>
    </div>
  </section>

  <section id="view-directory" class="view">
    <div class="page">
      <h1>Directory</h1>
      <p class="muted">Every spring by country and region. Use the filters to narrow the whole directory.</p>
      <div id="dirFilters" class="dirfilters"></div>
      <div id="dir"></div>
    </div>
  </section>

  <section id="view-me" class="view">
    <div class="page" id="me"></div>
  </section>

  <section id="view-about" class="view">
    <div class="page prose" id="about"></div>
  </section>
  <section id="view-how" class="view">
    <div class="page prose" id="how"></div>
  </section>
  <section id="view-terms" class="view">
    <div class="page prose" id="terms"></div>
  </section>
</main>

<div id="scrim" class="scrim" hidden></div>
<aside id="sheet" class="sheet" hidden aria-live="polite"></aside>
<div id="toast" class="toast" hidden></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="app.js?v=20261122a"></script>
</body>
</html>
